site_name: Open Energy Planner
site_description: Understand your energy. Make your first local plan.
site_url: https://patrickvorgers.github.io/open-energy-planner/
docs_dir: ..
site_dir: ../../.local/documentation/open-energy-planner
dev_addr: 127.0.0.1:18766
use_directory_urls: true
theme:
  name: null
  custom_dir: theme
  static_templates: [404.html]
plugins:
  - search:
      lang: en
hooks: [hooks.py]
markdown_extensions:
  - attr_list
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
nav:
  - Start here: docs/index.md
  - Use OEP:
      - How OEP works: docs/users/how-oep-works.md
      - Before you start: docs/users/before-you-start.md
      - Try your first plan: docs/users/first-plan.md
      - Connect Home Assistant: docs/users/home-assistant.md
      - Configure OEP: docs/users/configuration.md
      - Installation settings: docs/users/installation.md
      - Contract and prices: docs/users/contract.md
      - Understand forecasts: docs/users/forecasts.md
      - Appliances and requests: docs/users/appliances.md
      - Read your plan: docs/users/read-your-plan.md
      - Understand savings: docs/users/savings.md
      - Calculation time: docs/users/planning-performance.md
      - Data storage: docs/users/data-storage.md
      - Troubleshooting: docs/users/troubleshooting.md
      - Energy glossary: docs/users/glossary.md
  - Develop OEP:
      - Start developing: docs/development/README.md
      - Architecture overview: docs/development/ARCHITECTURE-OVERVIEW.md
      - Dev Container provisioning: provisioning/index.html
      - Supervisor environment: docs/development/DEVELOPER-ENVIRONMENT.md
      - Interactive scenarios: docs/development/USER-TEST-ENVIRONMENT.md
      - Contributing: CONTRIBUTING.md
      - Tests and CI: docs/development/CI-STAGES.md
      - Reference library: docs/development/REFERENCE-INDEX.md
      - Documentation maintenance: docs/development/DOCUMENTATION-SITE.md
