<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="oep-api-base" content="__OEP_BASE__"><title>Open Energy Planner: Appliance cycles</title><link rel="stylesheet" href="/setup/style.css"><link rel="stylesheet" href="/setup/workspace.css"><script src="/setup/chart.umd.min.js"></script><script type="module" src="/setup/appliance-cycles.js"></script><link rel="icon" type="image/svg+xml" href="/setup/icons/app.svg"><link rel="stylesheet" href="/setup/activity.css"><link rel="stylesheet" href="/setup/settings-layout.css"><link rel="stylesheet" href="/setup/appliance-cycles.css"></head>
<body class="workspace settings-workspace cycles-workspace"><!-- OEP_NAVIGATION -->
<main class="workspace-main"><header class="page-header"><div><h1 class="page-heading"><img class="page-icon" src="/setup/icons/appliances.svg" alt="" width="32" height="32"><span>Appliance cycles</span></h1></div></header><p id="status" role="status" class="muted"></p><form id="connect"><label>Installation API token<input id="token" type="password" autocomplete="off"></label><button disabled>Connect</button></form>

<section id="cycle-empty" class="chart-card" hidden><h2>No followed cycle appliances</h2><p>Select a consumption appliance in <a href="/appliance-settings">Appliances settings</a> to inspect its learning evidence. Shifting permission is not required.</p></section><div id="appliance-profiles" hidden>
<section class="settings-toolbar" aria-label="Cycle appliance selection"><label for="profile-device">Appliance<select id="profile-device" aria-label="Appliance"></select></label><nav class="settings-actions" aria-label="Appliance actions"><a href="/appliances">Open appliance planning</a><a href="/appliance-settings">Appliances settings</a></nav></section>
<header class="cycle-profile-header"><div><h2 id="profile-title"></h2><p id="profile-summary"></p></div><span id="profile-kind" class="settings-tag"></span></header>
<p id="profile-note" class="cycle-profile-note" hidden></p>
<div class="cycle-columns"><section class="chart-card" aria-labelledby="profile-heading"><h2 id="profile-heading">Average cycle profile</h2><div class="chart-grid" id="cycle-charts"><div><h3>Average power</h3><div class="chart-wrap"><canvas id="cycle-chart" role="img" aria-label="Average appliance cycle power by elapsed phase"></canvas></div></div><div><h3>Energy per phase</h3><div class="chart-wrap"><canvas id="cycle-energy-chart" role="img" aria-label="Learned appliance energy consumption per phase"></canvas></div></div></div></section><aside id="profile-history" class="chart-card" aria-label="Detected cycles and learning evidence"><p id="profile-evidence"></p></aside></div></div></main></body></html>
