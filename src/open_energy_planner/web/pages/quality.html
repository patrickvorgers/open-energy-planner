<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="oep-api-base" content="__OEP_BASE__"><title>Open Energy Planner: Forecast quality</title><link rel="stylesheet" href="/setup/style.css"><link rel="stylesheet" href="/setup/workspace.css"><script src="/setup/chart.umd.min.js"></script><script type="module" src="/setup/quality.js"></script><link rel="icon" type="image/svg+xml" href="/setup/icons/app.svg"></head>
<body class="workspace forecast-workspace"><!-- OEP_NAVIGATION -->
<main class="workspace-main"><header class="page-header"><div><h1 class="page-heading"><img class="page-icon" src="/setup/icons/quality.svg" alt="" width="32" height="32"><span>Forecast quality</span></h1></div></header>
<form id="connect"><label>Installation API token<input id="token" type="password" autocomplete="off"></label><button>Connect</button></form>
<p id="quality-status" role="status"></p>
<section class="toolbar view-filters"><label>Day<select id="quality-day" aria-label="Day" disabled><option value="">No day selected</option></select></label><button id="quality-refresh" class="secondary" type="button">Refresh evidence</button><button id="quality-older" class="secondary" type="button" disabled hidden>Load older days</button></section>
<nav id="quality-subjects" class="section-tabs" aria-label="Forecast subjects"><button type="button" data-subject="household" aria-pressed="true">Household</button><button type="button" data-subject="solar" aria-pressed="false">Solar</button><button type="button" data-subject="devices" aria-pressed="false">Devices</button></nav>
<label id="quality-source-label" hidden><span id="quality-source-title">Device</span><select id="quality-source" disabled></select></label>
<p class="quality-context">Original forecasts are fixed at midnight. Accuracy waits for a complete comparable day. <a id="quality-appliance-settings" href="/appliance-settings">Appliances settings</a></p>
<section id="quality-charts" class="quality-grid" aria-label="Original forecasts and measured energy"></section>
<section id="quality-models" class="quality-grid" aria-label="Current forecasts without a graph for this day"></section>
<p id="quality-model-issue" role="status"></p>
</main></body></html>
