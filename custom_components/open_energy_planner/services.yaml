{
  "appliance_context": {
    "name": "Execution context",
    "description": "Read the durably correlated task and attempt. No physical action.",
    "fields": {
      "device_id": {
        "name": "Virtual OEP appliance",
        "description": "Select the virtual Energy consumer device, not the physical appliance.",
        "required": true,
        "selector": {
          "device": {
            "integration": "open_energy_planner"
          }
        }
      }
    }
  },
  "appliance_ready": {
    "name": "Appliance ready",
    "description": "Submit one ready cycle and an absolute finish-before deadline.",
    "fields": {
      "device_id": {
        "name": "Virtual OEP appliance",
        "description": "Select the virtual Energy consumer device, not the physical appliance.",
        "required": true,
        "selector": {
          "device": {
            "integration": "open_energy_planner"
          }
        }
      },
      "request_id": {
        "name": "Readiness request ID",
        "description": "Use a stable identifier when retrying the same submission.",
        "required": true,
        "selector": {
          "text": {}
        }
      },
      "ready_at": {
        "name": "Ready at",
        "description": "Optional aware ISO timestamp. Defaults to now.",
        "required": false,
        "selector": {
          "text": {}
        }
      },
      "deadline": {
        "name": "Finish before",
        "description": "Absolute ISO timestamp including timezone.",
        "required": true,
        "selector": {
          "text": {}
        }
      }
    }
  },
  "appliance_claim": {
    "name": "Validate and claim start",
    "description": "Authorize the exact current start request once, immediately before the physical action.",
    "fields": {
      "device_id": {
        "name": "Virtual OEP appliance",
        "description": "Select the virtual Energy consumer device, not the physical appliance.",
        "required": true,
        "selector": {
          "device": {
            "integration": "open_energy_planner"
          }
        }
      },
      "task_id": {
        "name": "Task ID",
        "description": "Supplied automatically by the blueprint.",
        "required": true,
        "selector": {
          "text": {}
        }
      },
      "attempt_id": {
        "name": "Attempt ID",
        "description": "Supplied automatically by the blueprint.",
        "required": true,
        "selector": {
          "text": {}
        }
      }
    }
  },
  "appliance_feedback": {
    "name": "Appliance execution feedback",
    "description": "Report physical evidence. Not started also guarantees all delayed execution is cancelled.",
    "fields": {
      "device_id": {
        "name": "Virtual OEP appliance",
        "description": "Select the virtual Energy consumer device, not the physical appliance.",
        "required": true,
        "selector": {
          "device": {
            "integration": "open_energy_planner"
          }
        }
      },
      "task_id": {
        "name": "Task ID",
        "description": "Supplied automatically by the blueprint.",
        "required": true,
        "selector": {
          "text": {}
        }
      },
      "attempt_id": {
        "name": "Attempt ID",
        "description": "Supplied automatically by the blueprint.",
        "required": true,
        "selector": {
          "text": {}
        }
      },
      "event": {
        "name": "Outcome",
        "description": "started, not_started or completed.",
        "required": true,
        "selector": {
          "select": {
            "options": [
              "started",
              "not_started",
              "completed"
            ]
          }
        }
      },
      "at": {
        "name": "Observed at",
        "description": "Actual aware observation time. Defaults to now.",
        "required": false,
        "selector": {
          "text": {}
        }
      },
      "cancelled": {
        "name": "Delayed execution prevented",
        "description": "Required true for not_started. Never infer this from a timeout.",
        "required": false,
        "selector": {
          "boolean": {}
        }
      }
    }
  },
  "appliance_record_cycle": {
    "name": "Record completed cycle",
    "description": "Learn an average profile from a known completed cycle and fine cumulative Energy history.",
    "fields": {
      "device_id": {
        "name": "Virtual OEP appliance",
        "description": "Select the virtual Energy consumer device, not the physical appliance.",
        "required": true,
        "selector": {
          "device": {
            "integration": "open_energy_planner"
          }
        }
      },
      "cycle_id": {
        "name": "Completed cycle ID",
        "description": "Stable ID prevents learning the same cycle twice.",
        "required": true,
        "selector": {
          "text": {}
        }
      },
      "started_at": {
        "name": "Actual start",
        "description": "Aware ISO timestamp for the actual physical start.",
        "required": true,
        "selector": {
          "text": {}
        }
      },
      "completed_at": {
        "name": "Actual completion",
        "description": "Aware ISO timestamp for confirmed completion.",
        "required": true,
        "selector": {
          "text": {}
        }
      }
    }
  },
  "ev_schedule": {
    "name": "Plan charging request",
    "description": "Create or atomically edit one charging request. Omitted target and departure use the saved vehicle defaults. Repetition is off unless weekdays are supplied.",
    "fields": {
      "device_id": {
        "name": "Virtual OEP vehicle",
        "description": "Choose the virtual vehicle, not the physical charge point.",
        "required": true,
        "selector": {
          "device": {
            "integration": "open_energy_planner"
          }
        }
      },
      "request_id": {
        "name": "Charging request ID",
        "description": "A UUID kept unchanged when retrying the same creation. Use the saved request ID when editing or cancelling.",
        "required": true,
        "selector": {
          "text": {}
        }
      },
      "target_soc": {
        "name": "Target state of charge",
        "selector": {
          "number": {
            "min": 0,
            "max": 100,
            "unit_of_measurement": "%",
            "mode": "box"
          }
        }
      },
      "departure": {
        "name": "Ready by",
        "description": "Aware ISO date and time for this request.",
        "selector": {
          "text": {}
        }
      },
      "repeat_weekdays": {
        "name": "Repeat weekdays",
        "description": "Optional list with Monday=0 through Sunday=6. An empty list does not repeat.",
        "selector": {
          "object": {}
        }
      },
      "expected_version": {
        "name": "Saved request version",
        "description": "Use the saved charging_request.version when editing or cancelling.",
        "selector": {
          "text": {}
        }
      }
    }
  },
  "ev_cancel": {
    "name": "Cancel charging request",
    "description": "Cancel the exact saved request and its repetition. History is retained.",
    "fields": {
      "device_id": {
        "name": "Virtual OEP vehicle",
        "description": "Choose the virtual vehicle, not the physical charge point.",
        "required": true,
        "selector": {
          "device": {
            "integration": "open_energy_planner"
          }
        }
      },
      "request_id": {
        "name": "Charging request ID",
        "description": "A UUID kept unchanged when retrying the same creation. Use the saved request ID when editing or cancelling.",
        "required": true,
        "selector": {
          "text": {}
        }
      },
      "expected_version": {
        "name": "Saved request version",
        "description": "Use the saved charging_request.version when editing or cancelling.",
        "selector": {
          "text": {}
        },
        "required": true
      }
    }
  }
}
