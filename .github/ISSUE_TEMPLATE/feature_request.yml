name: Feature request
description: Suggest a change to Open Energy Planner.
body:
  - type: markdown
    attributes:
      value: This issue is public. Use synthetic examples and remove private information from screenshots and attachments.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Desired behaviour
      description: Describe what should happen and how you would know the change works.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples or related issues
      description: Add links, mockups or synthetic examples that clarify the request.
