name: Quick checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Draft transitions cancel candidates without interrupting this revision's cheap checks.
concurrency:
  group: >-
    ${{ github.event.action == 'edited' && github.event.changes.base.ref.from == null
        && format('metadata-{0}', github.run_id)
        || format('pr-quick-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick checks
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/quick-checks
