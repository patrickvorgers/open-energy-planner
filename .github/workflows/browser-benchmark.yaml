name: Browser CPU paired benchmark
on:
  push:
    branches: [ci/browser-resource-benchmark]

concurrency:
  group: browser-resource-benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OEP_BENCH_EXPECTED_INVENTORY: c71c8d6dd512d8fbda677dbb90398a0dff9c9e2e981ecc3f1f66c1837b5cb339
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: benchmark-image
          run-id: 43607042861
          github-token: ${{ github.token }}
          path: .local/benchmark
      - name: Verify the original image and preserve provenance
        run: |
          test "$(cat .local/benchmark/source-commit.txt)" = "1ba09a77f7fb7351e9f0961ab667a5e211d566b5"
          cd .local/benchmark
          echo "fe2817f05c72e517cf7a75392a36fb1b32d66e2d335f10ea8fa7f01733299951  image.tar" | sha256sum -c -
          docker load -i image.tar
          test "$(docker image inspect --format '{{.Id}}' oep-browser-benchmark)" = "sha256:15bec8f392e57f5c4eb43b98dcda9e97cf1e50203f6509bcc19384cb960d38a4"
          cd ../..
          mkdir -p results/ci/provenance
          cp .local/benchmark/image.json .local/benchmark/image.sha256 .local/benchmark/source-commit.txt results/ci/provenance/
          git rev-parse HEAD > results/ci/provenance/harness-commit.txt
          sha256sum script/ci/browser_benchmark.py > results/ci/provenance/harness.sha256
          python -m pip install pytest==9.1.1
      - name: Control with two workers at one CPU and two GiB each
        run: python -m script.ci.browser_benchmark run --variant memory --directory results/ci/memory-0
      - name: Experiment with two workers at two CPUs and two GiB each
        if: ${{ !cancelled() }}
        run: python -m script.ci.browser_benchmark run --variant cpu --directory results/ci/cpu-0
      - name: Compare only complete successful executions
        run: |
          python -m script.ci.browser_benchmark compare-cpu --directory results/ci
          cat results/ci/comparison.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-cpu-paired
          path: results/ci/
          retention-days: 2
          if-no-files-found: error
