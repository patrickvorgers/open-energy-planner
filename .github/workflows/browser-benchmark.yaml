name: Browser resource benchmark
on:
  push:
    branches: [ci/browser-resource-benchmark]

concurrency:
  group: browser-resource-benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: docker
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: compose.yaml
          targets: ui-tests
          load: true
          set: |
            ui-tests.tags=oep-browser-benchmark
            ui-tests.cache-from=type=gha,scope=oep-ui
      - name: Export the single immutable browser image
        run: |
          mkdir -p .local/benchmark
          git rev-parse HEAD > .local/benchmark/source-commit.txt
          docker image inspect oep-browser-benchmark > .local/benchmark/image.json
          docker save -o .local/benchmark/image.tar oep-browser-benchmark
          cd .local/benchmark
          sha256sum image.tar > image.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-image
          path: .local/benchmark/
          include-hidden-files: true
          compression-level: 1
          retention-days: 2
          if-no-files-found: error
  measure:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            machine: 0
          - variant: memory
            machine: 0
          - variant: split
            machine: 0
          - variant: split
            machine: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: benchmark-image
          path: .local/benchmark
      - name: Verify and load identical image bytes
        run: |
          test "$(cat .local/benchmark/source-commit.txt)" = "$GITHUB_SHA"
          cd .local/benchmark
          sha256sum -c image.sha256
          docker load -i image.tar
      - name: Run the complete assigned browser selection
        env:
          VARIANT: ${{ matrix.variant }}
          MACHINE: ${{ matrix.machine }}
        run: |
          python -m pip install pytest==9.1.1
          python -m script.ci.browser_benchmark run --variant "$VARIANT" --machine "$MACHINE" --directory "results/ci/$VARIANT-$MACHINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-measure-${{ matrix.variant }}-${{ matrix.machine }}
          path: results/ci/
          retention-days: 14
          if-no-files-found: error
  compare:
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: browser-measure-*
          merge-multiple: true
          path: results/ci
      - name: Verify complete execution and compare elapsed time
        env:
          # Original successful build 361.1 has the same 1,748 browser identities.
          OEP_BENCH_EXPECTED_INVENTORY: c71c8d6dd512d8fbda677dbb90398a0dff9c9e2e981ecc3f1f66c1837b5cb339
        run: |
          python -m pip install pytest==9.1.1
          python -m script.ci.browser_benchmark summarize --directory results/ci
          cat results/ci/comparison.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-comparison
          path: results/ci/comparison.json
          if-no-files-found: error
          retention-days: 14
