name: Checks
on:
  push:
    branches: [main]
  pull_request:
    types: [ready_for_review, converted_to_draft, labeled]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # Other label edits must not cancel a deliberately requested candidate run.
  group: >-
    ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'ci: run'
        && format('ignored-label-{0}', github.run_id)
        || format('pr-ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  candidate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       (github.event.action == 'ready_for_review' || github.event.label.name == 'ci: run'))
    uses: ./.github/workflows/ci-admission.yaml
    permissions:
      contents: read
      # Read candidate identities and original artifacts only in the admission job.
      actions: read
      checks: read
      pull-requests: read
  prepare:
    needs: candidate
    if: needs.candidate.outputs.reuse != 'true'
    name: Prepare selected test images and inventories
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      profile: ${{ steps.scope.outputs.profile || 'full' }}
      documentation_only: ${{ steps.scope.outputs.documentation_only }}
      test_only: ${{ steps.scope.outputs.test_only }}
      matrix_profile: ${{ steps.scope.outputs.matrix_profile }}
      tree: ${{ steps.source.outputs.tree }}
      matrix: ${{ steps.parallel.outputs.matrix }}
    env:
      COMPOSE_PROJECT_NAME: oep-check-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up host orchestration Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Capture the checked-out source tree
        id: source
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
      - name: Select checks using the PR base policy
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          policy_parent="$(cd "$RUNNER_TEMP" && pwd -P)"
          policy_root="$(mktemp -d "$policy_parent/oep-ci-policy.XXXXXX")"
          [[ "$policy_root" == "$policy_parent"/oep-ci-policy.* ]] || exit 1
          trap 'rm -rf -- "$policy_root"' EXIT
          policy_output="$policy_root/policy-output"
          policy_archive="$policy_root/policy.tar"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "push" ]] && [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git archive "$PR_BASE_SHA" script > "$policy_archive" && python -I -S -c 'import sys, tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2], filter="data")' "$policy_archive" "$policy_root"; then
            policy="$policy_root/script/ci/ci_scope.py"
            if [[ ! -f "$policy" ]]; then
              policy="$policy_root/script/ci_scope.py"
            fi
            if GITHUB_OUTPUT="$policy_output" python -I -S "$policy" && [[ -s "$policy_output" ]]; then
              cat "$policy_output" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "documentation_only=false" >> "$GITHUB_OUTPUT"
          echo "profile=full" >> "$GITHUB_OUTPUT"
          echo "matrix_profile=full" >> "$GITHUB_OUTPUT"
          echo "test_only=false" >> "$GITHUB_OUTPUT"
          echo "targets=app,native,ha-tests,ui-tests" >> "$GITHUB_OUTPUT"
          echo "CI scope: full checks (non-PR event or unavailable base policy)"
      - name: Report authoritative CI selection
        run: python -m script.ci.scope_report
      - name: Release unused hosted-runner SDK storage
        if: steps.scope.outputs.documentation_only != 'true'
        run: |
          # This job uses Python and Docker; unused mobile/.NET SDKs crowd out the private Supervisor engine.
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - name: Enable shared build and container image storage
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          configuration = Path('/etc/docker/daemon.json')
          settings = json.loads(configuration.read_text()) if configuration.exists() else {}
          settings.setdefault('features', {})['containerd-snapshotter'] = True
          configuration.write_text(json.dumps(settings))
          PY
          sudo systemctl restart docker
          docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter.v1'
      - name: Set up cached image builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker
      - name: Build current test images with reusable layers
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: .
          files: compose.yaml
          targets: ${{ steps.scope.outputs.targets || (steps.scope.outputs.documentation_only == 'true' && 'native' || 'app,native,ha-tests,ui-tests') }}
          load: true
          set: |
            app.tags=${{ env.COMPOSE_PROJECT_NAME }}-app
            native.tags=${{ env.COMPOSE_PROJECT_NAME }}-native
            native.tags+=${{ env.COMPOSE_PROJECT_NAME }}-provision-tests
            native.tags+=${{ env.COMPOSE_PROJECT_NAME }}-db-tests
            ha-tests.tags=${{ env.COMPOSE_PROJECT_NAME }}-ha-tests
            ui-tests.tags=${{ env.COMPOSE_PROJECT_NAME }}-ui-tests
            app.cache-from=type=gha,scope=oep-app
            app.cache-to=type=gha,scope=oep-app,mode=max,ignore-error=true,timeout=60s
            native.cache-from=type=gha,scope=oep-native
            native.cache-to=type=gha,scope=oep-native,mode=max,ignore-error=true,timeout=60s
            ha-tests.cache-from=type=gha,scope=oep-ha
            ha-tests.cache-to=type=gha,scope=oep-ha,mode=max,ignore-error=true,timeout=60s
            ui-tests.cache-from=type=gha,scope=oep-ui
            ui-tests.cache-to=type=gha,scope=oep-ui,mode=max,ignore-error=true,timeout=60s
      - name: Packaged test images, collection and provisioning imports
        env:
          OEP_CI_PROFILE: ${{ steps.scope.outputs.profile || (steps.scope.outputs.documentation_only == 'true' && 'documentation' || 'full') }}
        run: python script/ci/ci.py --prebuilt --stage preflight --profile "$OEP_CI_PROFILE"
      - name: Export each prepared test image once
        id: parallel
        env:
          OEP_CI_PROFILE: ${{ steps.scope.outputs.profile || 'full' }}
        run: python -m script.ci.parallel_checks export --profile "$OEP_CI_PROFILE"
      - name: Preserve prepared selection and inventories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-prepared
          include-hidden-files: true
          path: |
            .local/ci-prepared/parallel-plan.json
            .local/ci-prepared/preflight/
          if-no-files-found: error
          retention-days: 14
      - name: Share the prepared native image
        if: hashFiles('.local/ci-prepared/native.tar') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-native
          include-hidden-files: true
          path: .local/ci-prepared/native.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Share the prepared app image
        if: hashFiles('.local/ci-prepared/app.tar') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-app
          include-hidden-files: true
          path: .local/ci-prepared/app.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Share the prepared ha-tests image
        if: hashFiles('.local/ci-prepared/ha-tests.tar') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-ha-tests
          include-hidden-files: true
          path: .local/ci-prepared/ha-tests.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Share the prepared ui-tests image
        if: hashFiles('.local/ci-prepared/ui-tests.tar') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-ui-tests
          include-hidden-files: true
          path: .local/ci-prepared/ui-tests.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-preflight-diagnostics
          path: |
            results/ci/*.xml
            results/ci/browser-*/*.xml
            results/ci/browser-*/*.json
            results/ci/suite-completion.json
            results/ci/phase-times*.json
            results/ci/selection.json
            results/ci/preflight-*.log
            results/ci/price-history-*.json
            results/ci/**/*.png
            results/ci/supervisor-*.json
            results/ci/supervisor-failure.log
          if-no-files-found: warn
          retention-days: 14

  tests:
    needs: prepare
    if: needs.prepare.result == 'success'
    name: Selected tests (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      COMPOSE_PROJECT_NAME: oep-check-${{ github.run_id }}-${{ github.run_attempt }}
      OEP_CI_PROFILE: ${{ needs.prepare.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Load the prepared selection and inventories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-prepared
          path: .local/ci-prepared
      - name: Download the selected native image
        if: contains(matrix.images, 'native')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-image-native
          path: .local/ci-prepared
      - name: Download the selected app image
        if: contains(matrix.images, 'app')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-image-app
          path: .local/ci-prepared
      - name: Download the selected ha-tests image
        if: contains(matrix.images, 'ha-tests')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-image-ha-tests
          path: .local/ci-prepared
      - name: Download the selected ui-tests image
        if: contains(matrix.images, 'ui-tests')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-image-ui-tests
          path: .local/ci-prepared
      - name: Release storage for actual Supervisor acceptance
        if: matrix.lane == 'supervisor'
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Verify the prepared image bytes and load selected images
        run: python -m script.ci.parallel_checks load --profile "$OEP_CI_PROFILE" --lane "${{ matrix.lane }}"
      - name: Execute this machine's assigned suites
        run: python script/ci/ci.py --prebuilt --stage tests --profile "$OEP_CI_PROFILE" --lane "${{ matrix.lane }}"
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports-${{ matrix.lane }}
          path: |
            results/ci/*.xml
            results/ci/browser-*/*.xml
            results/ci/browser-*/*.json
            results/ci/lane-completion-*.json
            results/ci/phase-times*.json
            results/ci/selection.json
            results/ci/preflight-*.log
            results/ci/price-history-*.json
            results/ci/**/*.png
            results/ci/supervisor-*.json
            results/ci/supervisor-failure.log
          if-no-files-found: warn
          retention-days: 14

  quality:
    needs: [candidate, prepare, tests]
    if: >-
      !cancelled() && needs.candidate.outputs.reuse != 'true' &&
      needs.prepare.result == 'success' && needs.tests.result == 'success'
    name: Quality and integration (AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build_attempt: ${{ steps.bundle.outputs.attempt }}
    env:
      OEP_CI_PROFILE: ${{ needs.prepare.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Retain the prepared source identity
        id: source
        env:
          OEP_TESTED_TREE: ${{ needs.prepare.outputs.tree }}
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$OEP_TESTED_TREE"
          echo "tree=$OEP_TESTED_TREE" >> "$GITHUB_OUTPUT"
      - name: Retain the immutable base selection
        id: scope
        env:
          DOCUMENTATION_ONLY: ${{ needs.prepare.outputs.documentation_only }}
          TEST_ONLY: ${{ needs.prepare.outputs.test_only }}
          MATRIX_PROFILE: ${{ needs.prepare.outputs.matrix_profile }}
        run: |
          echo "profile=$OEP_CI_PROFILE" >> "$GITHUB_OUTPUT"
          echo "documentation_only=$DOCUMENTATION_ONLY" >> "$GITHUB_OUTPUT"
          echo "test_only=$TEST_ONLY" >> "$GITHUB_OUTPUT"
          echo "matrix_profile=$MATRIX_PROFILE" >> "$GITHUB_OUTPUT"
      - name: Download the original preparation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-prepared
          path: .local/ci-prepared
      - name: Download each machine's original reports separately
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ci-reports-*
          path: .local/ci-lanes
      - name: Documentation, Ruff and CI routing checks
        if: steps.scope.outputs.documentation_only == 'true'
        run: python -m script.ci.parallel_checks join --profile "$OEP_CI_PROFILE"
      - name: Native checks, planner scenarios, app smoke and real HA handoff
        if: steps.scope.outputs.documentation_only != 'true' && (steps.scope.outputs.matrix_profile == 'full' || steps.scope.outputs.profile == 'full' || steps.scope.outputs.profile == '')
        env:
          OEP_CI_PROFILE: ${{ steps.scope.outputs.profile || 'full' }}
        run: python -m script.ci.parallel_checks join --profile "$OEP_CI_PROFILE"
      - name: Selected native and integration suites
        if: steps.scope.outputs.documentation_only != 'true' && steps.scope.outputs.matrix_profile != 'full' && steps.scope.outputs.profile != 'full' && steps.scope.outputs.profile != ''
        env:
          OEP_CI_PROFILE: ${{ steps.scope.outputs.profile }}
        run: python -m script.ci.parallel_checks join --profile "$OEP_CI_PROFILE"
      - name: ${{ (steps.scope.outputs.matrix_profile == 'full' || steps.scope.outputs.profile == 'full' || steps.scope.outputs.profile == '') && 'Full CI suite completion' || 'Selected CI suite completion' }}
        if: steps.scope.outputs.documentation_only != 'true'
        env:
          OEP_CI_PROFILE: ${{ steps.scope.outputs.profile || 'full' }}
          OEP_TESTED_TREE: ${{ steps.source.outputs.tree }}
        run: python -m script.ci.check_suite_completion --profile "$OEP_CI_PROFILE" --tree "$OEP_TESTED_TREE"
      - name: Build matched private installation bundle
        id: bundle
        if: steps.scope.outputs.documentation_only != 'true' && steps.scope.outputs.test_only != 'true'
        env:
          OEP_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          OEP_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          arguments=(.local/installation-bundle --build-number "$OEP_BUILD_NUMBER")
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            arguments+=(--release-tag "$OEP_RELEASE_TAG")
          fi
          python -m script.release.package_release "${arguments[@]}"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Preserve matched installation artifacts
        if: steps.scope.outputs.documentation_only != 'true' && steps.scope.outputs.test_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'release' && format('installation-bundle-amd64-{0}', github.run_attempt) || 'installation-bundle-amd64' }}
          path: |
            .local/installation-bundle/open_energy_planner.zip
            .local/installation-bundle/ha-app-repository.tar.gz
            .local/installation-bundle/release-manifest.json
            .local/installation-bundle/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: "Full CI source tree: ${{ steps.source.outputs.tree }} (${{ steps.scope.outputs.profile || 'full' }})"
        if: steps.scope.outputs.documentation_only != 'true' && (steps.scope.outputs.matrix_profile == 'full' || steps.scope.outputs.profile == 'full' || steps.scope.outputs.profile == '')
        env:
          OEP_TESTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$OEP_TESTED_TREE"
          git diff --exit-code HEAD --

      - name: 'Test-only CI source tree: ${{ steps.source.outputs.tree }} (${{ steps.scope.outputs.profile }})'
        if: steps.scope.outputs.test_only == 'true'
        env:
          OEP_TESTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$OEP_TESTED_TREE"
          git diff --exit-code HEAD --

      - name: 'Selected CI source tree: ${{ steps.source.outputs.tree }} (${{ steps.scope.outputs.profile }})'
        if: steps.scope.outputs.documentation_only != 'true' && steps.scope.outputs.test_only != 'true' && (startsWith(steps.scope.outputs.profile, 'selected:') || steps.scope.outputs.profile == 'ci' || steps.scope.outputs.profile == 'ci+performance-queries')
        env:
          OEP_TESTED_TREE: ${{ steps.source.outputs.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$OEP_TESTED_TREE"
          git diff --exit-code HEAD --

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-amd64
          path: |
            results/ci/*.xml
            results/ci/browser-*/*.xml
            results/ci/browser-*/*.json
            results/ci/suite-completion.json
            results/ci/lane-completion-*.json
            results/ci/parallel-plan.json
            results/ci/phase-times*.json
            results/ci/selection.json
            results/ci/preflight-*.log
            results/ci/price-history-*.json
            results/ci/**/*.png
            results/ci/supervisor-*.json
            results/ci/supervisor-failure.log
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Attach tested release artifacts
    if: github.event_name == 'release'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OEP_RELEASE_TAG: ${{ github.event.release.tag_name }}
      OEP_BUILD_ATTEMPT: ${{ needs.quality.outputs.build_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attach or resume the original tested release bundle
        run: python3 -m script.release.publish_release
