name: Verified PR commits (trusted base)
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verified-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signatures:
    name: GitHub Verified PR commits
    # Description/title edits do not change the commit range. Base retargeting does.
    if: >-
      github.event.pull_request.state == 'open' &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != null)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify PR history without executing PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ -f script/ci/check_commit_signatures.py ]]; then
            python3 -I script/ci/check_commit_signatures.py
          else
            python3 -I script/check_commit_signatures.py
          fi
