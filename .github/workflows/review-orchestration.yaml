name: OEP review orchestration
on:
  issue_comment:
    types: [created]
  check_run:
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

# Serialize durable intents and comment publication. Never cancel an active send.
concurrency:
  group: oep-review-orchestration
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.repository.default_branch == 'main' &&
      (github.event_name != 'check_run' ||
       github.event.check_run.app.id == 347564 || github.event.check_run.app.id == 413034) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == '/oep-reviewer review' ||
         github.event.comment.user.login == 'coderabbitai[bot]' ||
         github.event.comment.user.login == 'kody-ai[bot]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Resume explicit review requests using trusted main metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m script.ci.review_orchestration
