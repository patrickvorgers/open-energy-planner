name: Isolated provider quota diagnosis
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  quota:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'patrickvorgers/open-energy-planner' &&
      github.ref == 'refs/heads/ci/review-provider-diagnosis'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Publish one fixed bare quota question without checkout or retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from http.client import HTTPException
          from urllib.error import HTTPError, URLError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirects(HTTPRedirectHandler):
              """Keep the ephemeral credential on the fixed GitHub API endpoint."""

              def redirect_request(self, request, response, code, message, headers, new_url):
                  """Refuse redirects without issuing another authenticated request."""
                  return None

          request = Request(
              'https://api.github.com/repos/patrickvorgers/open-energy-planner/issues/47/comments',
              data=b'{"body":"@coderabbitai rate limit"}',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          try:
              with build_opener(NoRedirects()).open(request, timeout=20) as response:
                  print('HTTP status:', response.status)
                  if response.status != 201:
                      raise ValueError
                  payload = response.read(65537)
                  if len(payload) > 65536:
                      raise ValueError
                  comment = json.loads(payload)
                  if (
                      type(comment.get('id')) is not int
                      or comment.get('body') != '@coderabbitai rate limit'
                      or comment.get('user', {}).get('id') != 41898282
                      or comment.get('performed_via_github_app', {}).get('id') != 15368
                  ):
                      raise ValueError
                  print('Comment ID:', comment['id'])
          except HTTPError as error:
              print('HTTP status:', error.code)
              raise SystemExit(1) from None
          except (URLError, HTTPException, OSError, ValueError, TypeError, AttributeError):
              print('Publication not confirmed. Inspect the PR before any further action.')
              raise SystemExit(1) from None
          PY
