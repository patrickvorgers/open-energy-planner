name: Read-only preflight transport diagnostic
run-name: Diagnostic only, not review or candidate evidence
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string
      expected_head:
        description: Frozen current PR head SHA
        required: true
        type: string
      expected_base:
        description: Current PR base SHA
        required: true
        type: string
      codex_reviewed_sha:
        description: Independently reviewed commit within this PR history
        required: true
        type: string
      independent_codex_review_done:
        description: Independent Codex context review completed before the final correction batch
        required: true
        default: false
        type: boolean
      findings_dispositioned:
        description: Genuine findings evaluated and corrections batched and retested
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: preflight-api-transport-diagnostic
  cancel-in-progress: false

jobs:
  transport-diagnostic:
    if: github.ref == 'refs/heads/diagnostic/preflight-api-transport' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f8aeaebfe2122c46654ee3547d3f09749dc85667
          persist-credentials: false
      - name: Read API status and quota without provider values or credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import platform
          import re
          import ssl
          import subprocess
          import tempfile
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          token = os.environ['GITHUB_TOKEN']
          assert token and '\n' not in token and '\r' not in token
          print(json.dumps({'python': platform.python_version(), 'openssl': ssl.OPENSSL_VERSION, 'image': os.environ.get('ImageVersion'), 'diagnostic_only': True}))

          def probe(path):
              """Report only public status, schema, quota and transport categories."""
              request = Request('https://api.github.com/' + path, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              try:
                  with urlopen(request, timeout=20) as response:
                      data = response.read(2_000_001)
                      report = {'transport': 'urllib', 'path': path, 'status': response.status, 'bytes': len(data), 'remaining': response.headers.get('X-RateLimit-Remaining'), 'reset': response.headers.get('X-RateLimit-Reset')}
                      try:
                          payload = json.loads(data)
                          report['json_object'] = isinstance(payload, dict)
                          if path == 'rate_limit':
                              core = payload.get('resources', {}).get('core', {})
                              report['core'] = {key: core.get(key) for key in ('limit', 'remaining', 'reset')}
                          else:
                              report['expected_head'] = payload.get('head', {}).get('sha') == '8cdf7f71d37af81930371e023563efcad47a17dc'
                      except (ValueError, AttributeError):
                          report['json_object'] = False
                      print(json.dumps(report))
              except HTTPError as error:
                  print(json.dumps({'transport': 'urllib', 'path': path, 'http_error': error.code, 'remaining': error.headers.get('X-RateLimit-Remaining'), 'reset': error.headers.get('X-RateLimit-Reset')}))
              except URLError as error:
                  print(json.dumps({'transport': 'urllib', 'path': path, 'error_class': type(error.reason).__name__, 'verify_code': getattr(error.reason, 'verify_code', None)}))

          probe('rate_limit')
          probe('repos/patrickvorgers/open-energy-planner/pulls/5')
          with tempfile.TemporaryDirectory() as directory:
              config = 'header = "Authorization: Bearer ' + token + '"\nheader = "Accept: application/vnd.github+json"\n'
              result = subprocess.run(['curl', '--silent', '--max-time', '20', '--config', '-', '--output', str(Path(directory) / 'response.json'), '--write-out', '%{http_code}', 'https://api.github.com/repos/patrickvorgers/open-energy-planner/pulls/5'], input=config, text=True, capture_output=True)
              status = result.stdout.strip()
              print(json.dumps({'transport': 'curl', 'exit_code': result.returncode, 'status': status if re.fullmatch(r'\d{3}', status) else 'invalid'}))

          from urllib.parse import urlsplit
          from script.ci.check_commit_signatures import GitHub
          from script.ci.review_preflight import preflight

          client = GitHub(token)
          original_open = client._opener.open

          def traced_open(request, *args, **kwargs):
              """Locate a failed endpoint without logging authorization, bodies or exception text."""
              path = urlsplit(request.full_url).path
              try:
                  response = original_open(request, *args, **kwargs)
                  print(json.dumps({'preflight_path': path, 'status': response.status, 'remaining': response.headers.get('X-RateLimit-Remaining')}))
                  return response
              except HTTPError as error:
                  print(json.dumps({'preflight_path': path, 'http_error': error.code, 'remaining': error.headers.get('X-RateLimit-Remaining'), 'reset': error.headers.get('X-RateLimit-Reset')}))
                  raise
              except URLError as error:
                  print(json.dumps({'preflight_path': path, 'error_class': type(error.reason).__name__, 'verify_code': getattr(error.reason, 'verify_code', None)}))
                  raise

          client._opener.open = traced_open
          try:
              result = preflight('patrickvorgers/open-energy-planner', 5, '8cdf7f71d37af81930371e023563efcad47a17dc', 'f8aeaebfe2122c46654ee3547d3f09749dc85667', 'fa902487a57e69d5382a2340d7f70a24a1f0d380', client)
              print(json.dumps({'diagnostic_preflight': 'passed', 'hosted_gate': 'NOT replaced', 'summary_lines': len(result.splitlines())}))
          except Exception as error:
              print(json.dumps({'diagnostic_preflight': 'failed', 'error_type': type(error).__name__}))
          PY
