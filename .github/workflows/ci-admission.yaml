name: Candidate admission and evidence
on:
  workflow_call:
    secrets:
      OEP_RUNNER_READ_TOKEN:
        description: Optional read-only repository runner availability credential.
        required: false
    outputs:
      reuse:
        description: Validated reuse of an identical successful candidate.
        value: ${{ jobs.candidate.outputs.reuse }}
      runner_labels:
        description: Validated personal capacity or GitHub-hosted fallback labels.
        value: ${{ jobs.candidate.outputs.runner_labels }}

jobs:
  candidate:
    name: Candidate and pre-build checks
    if: >-
      github.event_name != 'pull_request' ||
      github.event.action == 'ready_for_review' || github.event.label.name == 'ci: run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
      runner_labels: ${{ steps.admission.outputs.runner_labels }}
    permissions:
      contents: read
      # Read candidate identities and original artifacts only in the admission job.
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require current reviewed PR candidate
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OEP_RUNNER_READ_TOKEN: ${{ secrets.OEP_RUNNER_READ_TOKEN }}
        run: python3 -m script.ci.check_ci_candidate
      - uses: ./.github/actions/quick-checks
      - name: Reuse an identical validated main merge when proven
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m script.ci.check_main_ci_reuse
