name: Formal review state (trusted main)
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string
      expected_head:
        description: Frozen PR head SHA
        required: true
        type: string
      expected_base:
        description: Frozen main base SHA
        required: true
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  review-state:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'patrickvorgers/open-energy-planner' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check formal objections, discussions and current-head review evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m script.ci.review_state
