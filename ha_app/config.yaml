{
  "name": "Open Energy Planner",
  "version": "0.2.0",
  "slug": "open_energy_planner",
  "description": "Local energy optimization for Home Assistant",
  "url": "https://github.com/patrickvorgers/open-energy-planner",
  "arch": [
    "amd64"
  ],
