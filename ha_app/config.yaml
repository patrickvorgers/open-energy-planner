  "hassio_api": true,
  "hassio_role": "default",
  "discovery": [
    "open_energy_planner"
  ],
  "options": {},
  "schema": {
    "database_url": "password?",
    "migrate_database": "bool?",
    "recover_storage": "bool?"
  }
}
